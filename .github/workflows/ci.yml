name: CI - Build, Test, and Push Notes App

# Runs on every push to main. Also runnable manually from the Actions tab.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/notes-app

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository code onto the runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python so we can install deps and run tests
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Install dependencies
      - name: Install dependencies
        working-directory: ./app
        run: pip install -r requirements.txt

      # 4. Run tests — fails the pipeline (and blocks the Docker push) if
      #    any test fails.
      - name: Run tests
        working-directory: ./app
        run: pytest -v

      # 5. Set up Docker Buildx (supports caching + multi-platform builds)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 6. Log in to Docker Hub using repository secrets
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 7. Build the image and push BOTH tags: latest + the commit SHA.
      #    Using the SHA as a version tag means every build is traceable
      #    back to an exact commit, while `latest` stays convenient for
      #    local pulls.
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
