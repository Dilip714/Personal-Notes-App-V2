# Using stringData (not data) so values here are plain text — Kubernetes
# base64-encodes them automatically when the object is created. Never
# commit real production credentials; this file is for local Minikube demo
# purposes. In production, use a secrets manager (AWS Secrets Manager,
# Sealed Secrets, etc.) instead of plain YAML.
apiVersion: v1
kind: Secret
metadata:
  name: notes-app-secret
type: Opaque
stringData:
  DB_USER: notes_user
  DB_PASSWORD: change_me
  MYSQL_ROOT_PASSWORD: root_change_me
