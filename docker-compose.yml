# Personal Notes App - docker-compose
# Flask serves both the API and the templated frontend, so there is one
# "web" service plus the MySQL database. Run with: docker compose up


services:
  mysql:
    image: mysql:8.0
    container_name: notes-mysql-v2
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_change_me}
      MYSQL_DATABASE: ${DB_NAME:-notes_db}
      MYSQL_USER: ${DB_USER:-notes_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change_me}
    ports:
      - "13306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: notes-web-v2
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-notes_user}
      DB_PASSWORD: ${DB_PASSWORD:-change_me}
      DB_NAME: ${DB_NAME:-notes_db}
      PORT: 5000
    ports:
      - "15000:5000"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
